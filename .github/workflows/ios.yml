# Unsigned iOS builds on GitHub's macOS runners (no Apple account here): sign and install the .ipa with Sideloadly
# and a free Apple ID (it lasts 7 days, then sign again).
#   Debug   = the development build (expo-dev-client): it loads the JavaScript from `npx expo start --dev-client --lan`
#             on the computer, so code changes need no new build; only a new native library does.
#   Release = the JavaScript inside the app; it only needs the computer's cosmos-lite server.
name: iOS ipa

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      configuration:
        description: Debug（开发版）或 Release（正式版）
        type: choice
        options: [Debug, Release]
        default: Debug

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.configuration || 'Debug' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CONFIGURATION: ${{ inputs.configuration || (startsWith(github.ref, 'refs/tags/v') && 'Release') || 'Debug' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version
          node --version

      - name: Install
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build (${{ env.CONFIGURATION }}, unsigned)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace $WS, scheme $SCHEME"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration "$CONFIGURATION" \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E '^(\*\*|error:|.*: error:|warning: .*deprecated)' || (tail -80 build.log; exit 1)

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/${CONFIGURATION}-iphoneos/*.app | head -1)
          echo "app $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          NAME="local-canvas-$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')-unsigned.ipa"
          zip -qry "$NAME" Payload
          echo "IPA=$NAME" >> "$GITHUB_ENV"
          ls -la "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}
          if-no-files-found: error

      - name: Build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.CONFIGURATION }}
          path: build.log
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA }}
